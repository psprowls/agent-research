region          = "us-east-1"
max_tokens      = 2048
max_concurrency = 5
sweep_candidates = [
  "qwen.qwen3-32b-v1:0",
  "qwen.qwen3-next-80b-a3b",
  "deepseek.v3.2",
  "moonshotai.kimi-k2.5",
