[project]
name = "graph-wiki-mcp"
version = "0.1.0"
description = "Focused graph-wiki MCP server package"
requires-python = ">=3.11"
dependencies = [
    "graph-wiki-core",
    "mcp>=1.27.1",
    "pydantic>=2.0",
]

[project.scripts]
graph-wiki-mcp = "graph_wiki_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
graph-wiki-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
markers = ["integration: requires real Bedrock or subprocess (skipped in CI by default)"]
