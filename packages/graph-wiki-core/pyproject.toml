[project]
name = "graph-wiki-core"
version = "0.1.1"
description = "Shared graph-wiki command, prompt, and runtime implementation"
requires-python = ">=3.11"
dependencies = [
    "wiki-io",
    "graph-io",
    "model-adapter",
    "subagent-runtime",
    "workspace-io",
    "work-io",
    "bm25s==0.3.8",
    "langchain-aws>=1.4.7",
    "langchain-core>=1.4.0",
    "typer>=0.25.1",
    "pydantic>=2.0",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
wiki-io         = { workspace = true }
graph-io        = { workspace = true }
model-adapter   = { workspace = true }
subagent-runtime = { workspace = true }
workspace-io    = { workspace = true }
work-io         = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
markers = ["integration: requires real Bedrock or subprocess (skipped in CI by default)"]
