[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio==1.3.0",
    "ruff>=0.15",
    "pre-commit",
    "syrupy==5.1.0",
    "hypothesis>=6.153.2",
    "pyright>=1.1.400",
]

[tool.ruff]
line-length = 120
# Vendored Anthropic Agent Skills (.agents/skills/, own LICENSE) and GSD
# milestone scaffolding (.gsd/) are not first-party source — don't lint them.
exclude = ["**/fixtures/**", ".agents/skills/**", ".gsd/**"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Prompt modules are mostly long Markdown prose held in triple-quoted string
# literals; wrapping would alter the text sent to the model (and `# noqa` cannot
# live inside a string). Exempt prompts from line-length only — all other
# E/F/I rules still apply.
"**/prompts/**" = ["E501"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["packages/eval-harness/tests"]
asyncio_mode = "auto"
# Don't recurse into src/ trees when running from the workspace root.
# `packages/graph-io/src/graph_io/test_suites.py` is the TestSuite emitter
# module (named per the ontology kind), not a pytest test module. Per-package
# `[tool.pytest.ini_options] testpaths = ["tests"]` already scopes things
# correctly when pytest runs inside a package; this guard catches workspace
# invocations.
norecursedirs = ["src", ".venv", ".git", ".claude", ".hypothesis", "node_modules", "dist", "build", ".worktrees"]
markers = [
    "integration: requires real Bedrock or subprocess (skipped by default)",
    "eval: opt-in eval suite (skipped unless GRAPH_WIKI_RUN_EVAL=1)",
]
